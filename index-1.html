<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="google" content="notranslate">
<title>Je Falla</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Je Falla">
<link rel="icon" href="jf192.png">
<link rel="apple-touch-icon" href="jf192.png">

<style>
:root{--jaune:#FFC244;--jaune-clair:#FFF3D6;--noir:#000;--fond:#fff;--texte:#000;--gris:#6b6b6b;--carte:#f2f2f2;--bord:#e2e2e2;--vert:#1e9e4a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fond:#121212;--texte:#f5f5f5;--gris:#a8a8a8;--carte:#242424;--bord:#333;--jaune-clair:#2b2410}}
:root[data-theme="dark"]{--fond:#121212;--texte:#f5f5f5;--gris:#a8a8a8;--carte:#242424;--bord:#333;--jaune-clair:#2b2410}
html,body{margin:0;background:var(--fond);color:var(--texte);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
#app{max-width:520px;margin:0 auto;min-height:100vh}
button{font:inherit;cursor:pointer;color:inherit}
.haut{background:#000;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
.logo{color:#fff;font-size:26px;font-weight:900}.logo b{color:var(--jaune)}
.pos{background:var(--jaune);color:#000;border:0;border-radius:20px;padding:8px 12px;font-weight:700;font-size:12px}
.jaune{background:var(--jaune);color:#000;padding:20px 18px 26px}
.jaune h1{margin:0;font-size:30px;font-weight:900}.jaune p{margin:4px 0 16px;font-size:15px}
.recherche{display:flex;background:#fff;border:2px solid #000;border-radius:14px;overflow:hidden}
.recherche input{flex:1;min-width:0;border:0;padding:16px 12px;font-size:15px;outline:none;color:#000}
.recherche button{background:#000;border:0;color:#fff;padding:0 18px;font-size:18px}
.grille{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.cat{background:var(--jaune-clair);border:2px solid var(--texte);border-radius:18px;padding:16px;min-height:140px;text-align:left}
.cat .i{font-size:42px;display:block}.cat .t{font-size:19px;font-weight:900;display:block;margin-top:8px}.cat .s{font-size:13px;color:var(--gris);display:block;margin-top:4px}
.pied{text-align:center;color:var(--gris);font-size:12px;padding:8px 16px 28px}
.bandeau{background:#000;padding:14px 16px;display:flex;align-items:center;gap:12px}
.retour{width:40px;height:40px;border-radius:50%;border:0;background:var(--jaune);color:#000;font-size:20px;font-weight:900;flex:none}
.bandeau h2{margin:0;color:#fff;font-size:20px;font-weight:900}.bandeau small{color:var(--jaune);font-size:13px}
.filtres{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px 0}
.pastille{background:transparent;border:2px solid var(--texte);border-radius:20px;padding:7px 12px;font-weight:700;font-size:13px}
.pastille.on{background:var(--texte);color:var(--jaune)}
:root:not([data-theme="dark"]) .pastille.on{color:var(--jaune)}
.liste{padding:16px}
.res{display:flex;gap:12px;width:100%;text-align:left;background:var(--fond);border:1.5px solid var(--bord);border-radius:16px;padding:14px;margin-bottom:12px}
.av{width:60px;height:60px;border-radius:14px;background:var(--jaune-clair);display:flex;align-items:center;justify-content:center;font-size:28px;flex:none}
.res .n{font-weight:800;font-size:16px}.res .m{font-size:13px;color:var(--gris);margin-top:2px}.res .p{font-size:13px;font-weight:700;margin-top:4px}
.badge{display:inline-block;color:#fff;font-size:11px;font-weight:800;border-radius:6px;padding:3px 8px;margin-top:6px}
.ok{background:var(--vert)}.ko{background:#6b6b6b}
.vide{text-align:center;color:var(--gris);padding:40px 24px}
.photo{background:var(--jaune);height:170px;display:flex;align-items:center;justify-content:center;font-size:76px;position:relative}
.photo .retour{position:absolute;top:16px;left:16px}
.fiche{padding:20px 18px 120px}
.fiche h2{margin:0;font-size:24px;font-weight:900}.fiche .q{color:var(--gris);font-size:14px;margin-top:4px}
.chiffres{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.chiffres div{background:var(--carte);border-radius:12px;padding:12px 6px;text-align:center}
.chiffres b{display:block;font-size:16px;font-weight:900}.chiffres span{font-size:11px;color:var(--gris)}
.desc{margin:16px 0;line-height:1.5}
.contact{display:flex;gap:8px}
.contact a{flex:1;text-align:center;text-decoration:none;color:var(--texte);border:2px solid var(--texte);border-radius:12px;padding:14px;font-weight:800}
.fiche h3{margin:24px 0 8px;font-size:18px;font-weight:900}
.avis{background:var(--carte);border-radius:12px;padding:12px;margin-bottom:8px}.avis b{font-size:13px}.avis p{margin:4px 0 0;font-size:14px;line-height:1.4}
.barre{position:fixed;left:0;right:0;bottom:0;background:var(--fond);border-top:1px solid var(--bord);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.barre button{display:block;width:100%;max-width:488px;margin:0 auto;background:var(--jaune);color:#000;border:2px solid #000;border-radius:14px;padding:16px;font-size:17px;font-weight:900}
.merci{position:fixed;left:16px;right:16px;bottom:90px;max-width:488px;margin:0 auto;background:#000;color:#fff;border-radius:14px;padding:14px 16px;font-weight:700;border:2px solid var(--jaune)}
</style>
</head>
<body>
<div id="app"></div>
<script>
// Catégories : « mots » sert à reconnaître ce que l’utilisateur tape
var CATS=[
{id:"restaurant",i:"🍲",t:"Restaurant",s:"Je falla où manger maintenant",m:["restaurant","manger","poulet","braise","braisé","poisson","ndole","ndolé","faim","resto"]},
{id:"shopping",i:"🛒",t:"Shopping",s:"Je falla un magasin ouvert",m:["shopping","magasin","boutique","supermarche","supermarché","pharmacie","eau","gaz","night shop"]},
{id:"laverie",i:"👕",t:"Laverie",s:"Laverie / laveur à domicile",m:["laverie","laveur","laveuse","pressing","linge","lessive","repassage"]},
{id:"plombier",i:"🔧",t:"Plombier",s:"Plombier / dépannage maison",m:["plombier","plomberie","fuite","robinet","wc","toilette","depannage","dépannage"]}
];
// Données fictives de Yaoundé : [id,cat,nom,quartier,emoji,km,min,prixTxt,prix,note,nbAvis,ouvert,statut,domicile,tel,desc,avis]
var P=[
["r1","restaurant","Chez Mama Ngono","Mvog-Ada","🍗",0.6,8,"à partir de 1 500 FCFA",1500,4.6,212,1,"OUVERT",0,"237670000001","Poulet braisé, poisson braisé et miondo. Ouvert tard.",[["Brice",5,"Poulet bien braisé, servi en 10 minutes."],["Estelle",4,"Du monde le soir, mais ça vaut le coup."]]],
["r2","restaurant","Le Ndolé de Bastos","Bastos","🍲",1.4,14,"à partir de 3 000 FCFA",3000,4.8,340,1,"OUVERT",0,"237670000002","Ndolé, eru, koki et plantains. Cadre calme et climatisé.",[["Carine",5,"Le meilleur ndolé du quartier."],["Patrick",5,"Service rapide, un peu cher mais bon."]]],
["r3","restaurant","Poisson Braisé Etoudi","Etoudi","🐟",2.1,19,"à partir de 2 000 FCFA",2000,4.3,98,0,"FERMÉ · ouvre à 17h",0,"237670000003","Bar et maquereau braisés, bâton de manioc.",[["Yannick",4,"Poisson frais, ambiance bon enfant."]]],
["s1","shopping","Night Shop Mendong","Mendong","🌙",0.5,6,"Ouvert 24h/24",0,4.4,76,1,"OUVERT",0,"237670000004","Eau, gaz, recharges, boissons et produits de base, même la nuit.",[["Ruth",5,"Sauvée à 2h du matin, gaz disponible."]]],
["s2","shopping","Super Marché Bastos","Bastos","🛒",1.1,12,"Livraison 500 FCFA",500,4.7,154,1,"OUVERT",1,"237670000005","Grand choix, livraison à domicile dans le quartier.",[["Mireille",5,"Livraison rapide, produits frais."]]],
["s3","shopping","Pharmacie de garde Mvog-Ada","Mvog-Ada","💊",0.9,10,"De garde cette nuit",0,4.5,61,1,"DE GARDE",0,"237670000006","Pharmacie de garde, conseils du pharmacien sur place.",[["Joël",5,"Accueil rapide malgré l’heure tardive."]]],
["l1","laverie","Pressing Express Bastos","Bastos","🧺",0.8,12,"à partir de 500 FCFA",500,4.7,189,1,"OUVERT",0,"237670000007","Lavage, repassage et pressing express. Retrait en 24h.",[["Sandrine",5,"Chemises impeccables, prêtes le lendemain."],["Hervé",4,"Bon travail, de l’attente le samedi."]]],
["l2","laverie","Mama Laveuse Mendong","Mendong","👩🏾",1.3,15,"1 000 FCFA/kg",1000,4.9,128,1,"DISPONIBLE",1,"237670000008","Passe chez toi, lave et rapporte ton linge propre et plié.",[["Nadège",5,"Venue en 15 minutes, linge nickel."],["Fabrice",5,"Sérieuse et ponctuelle."]]],
["l3","laverie","Laverie Etoudi Clean","Etoudi","🫧",2.4,22,"700 FCFA/kg",700,4.2,54,0,"FERMÉ · ouvre à 7h",0,"237670000009","Machines à jetons, séchage inclus.",[["Georges",4,"Pas cher et propre."]]],
["p1","plombier","Dépannage Plomberie Ada","Mvog-Ada","🔧",1.0,15,"Déplacement 2 000 FCFA",2000,4.6,87,1,"DISPONIBLE",1,"237670000010","Fuites, robinets, WC bouchés. Intervention rapide.",[["Clarisse",5,"Fuite réparée en 30 minutes, prix honnête."],["Désiré",4,"Arrivé vite, bien expliqué."]]],
["p2","plombier","Plombier Pro Bastos","Bastos","🚰",1.8,18,"Déplacement 3 000 FCFA",3000,4.8,142,1,"DISPONIBLE",1,"237670000011","Installation sanitaire, chauffe-eau, urgences 24h/24.",[["Olivia",5,"Très pro, matériel de qualité."]]]
].map(function(a){return{id:a[0],cat:a[1],nom:a[2],q:a[3],e:a[4],km:a[5],min:a[6],px:a[7],prix:a[8],note:a[9],nb:a[10],ouvert:!!a[11],statut:a[12],dom:!!a[13],tel:a[14],desc:a[15],avis:a[16]}});

var etat={vue:"accueil",requete:"",cat:null,filtre:"proche",fiche:null,pos:"📍 Yaoundé",merci:false};
var app=document.getElementById("app");

// Sécurise le texte tapé par l’utilisateur avant de l’afficher
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function trouverCat(t){t=t.trim().toLowerCase();if(!t)return null;var c=CATS.filter(function(c){return c.m.some(function(m){return t.indexOf(m)>-1||m.indexOf(t)>-1})})[0];return c?c.id:null}
function fmt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g," ")}

function accueil(){
return '<div class="haut"><div class="logo">Je <b>Falla</b></div><button class="pos" id="geo">'+esc(etat.pos)+'</button></div>'+
'<div class="jaune"><h1>Ça urge ? On trouve.</h1><p>Solutions à moins de 15 minutes autour de toi</p>'+
'<div class="recherche"><input id="q" placeholder="Je falla... ex: poulet braisé, pressing, plombier" enterkeyhint="search"><button id="go" aria-label="Chercher">🔍</button></div></div>'+
'<div class="grille">'+CATS.map(function(c){return '<button class="cat" data-cat="'+c.id+'"><span class="i">'+c.i+'</span><span class="t">'+c.t+'</span><span class="s">'+c.s+'</span></button>'}).join("")+'</div>'+
'<div class="pied">Fait à Yaoundé · léger, même avec une connexion lente</div>'}

function liste(){
var t=etat.requete.trim().toLowerCase(),l=etat.cat?P.filter(function(p){return p.cat===etat.cat}):P.filter(function(p){return (p.nom+p.desc+p.q).toLowerCase().indexOf(t)>-1});
if(etat.filtre==="ouvert")l=l.filter(function(p){return p.ouvert});
l=l.slice().sort(etat.filtre==="prix"?function(a,b){return (a.prix||1e9)-(b.prix||1e9)}:function(a,b){return a.km-b.km});return l}

function resultats(){
var c=CATS.filter(function(x){return x.id===etat.cat})[0],l=liste();
var F=[["ouvert","Ouvert maintenant"],["prix","Moins cher"],["proche","Le plus proche"]];
return '<div class="bandeau"><button class="retour" id="retour" aria-label="Retour">←</button><div><h2>'+(c?c.i+" "+c.t:"« "+esc(etat.requete)+" »")+'</h2><small>'+l.length+' solution(s) près de toi</small></div></div>'+
'<div class="filtres">'+F.map(function(f){return '<button class="pastille'+(etat.filtre===f[0]?" on":"")+'" data-f="'+f[0]+'">'+f[1]+'</button>'}).join("")+'</div><div class="liste">'+
(l.length?l.map(function(p){return '<button class="res" data-p="'+p.id+'"><div class="av">'+p.e+'</div><div><div class="n">'+p.nom+'</div><div class="m">'+(p.dom?"à domicile":p.km+" km")+' · '+p.min+' min · '+p.q+'</div><div class="p">'+p.px+' · '+p.note.toFixed(1)+'★</div><span class="badge '+(p.ouvert?"ok":"ko")+'">'+p.statut+'</span></div></button>'}).join(""):'<div class="vide"><div style="font-size:40px">🤷🏾</div>Rien trouvé pour « '+esc(etat.requete)+' ». Essaie « pressing », « plombier » ou « poulet braisé ».</div>')+'</div>'}

function fiche(){
var p=etat.fiche,msg=encodeURIComponent("Bonjour "+p.nom+", je vous trouve sur Je Falla. J’ai besoin de votre service maintenant.");
return '<div class="photo"><button class="retour" id="retour" aria-label="Retour">←</button>'+p.e+'</div><div class="fiche"><h2>'+p.nom+'</h2><div class="q">📍 '+p.q+', Yaoundé</div><span class="badge '+(p.ouvert?"ok":"ko")+'">'+p.statut+'</span>'+
'<div class="chiffres"><div><b>'+p.note.toFixed(1)+'★</b><span>'+p.nb+' avis</span></div><div><b>'+p.min+' min</b><span>arrivée</span></div><div><b>'+(p.prix?fmt(p.prix)+" F":"Sur place")+'</b><span>'+p.px+'</span></div></div>'+
'<p class="desc">'+p.desc+'</p><div class="contact"><a href="tel:+'+p.tel+'">📞 Appeler</a><a href="https://wa.me/'+p.tel+'?text='+msg+'" target="_blank" rel="noopener">💬 WhatsApp</a></div>'+
'<h3>Avis clients</h3>'+p.avis.map(function(a){return '<div class="avis"><b>'+a[0]+' · '+"★".repeat(a[1])+'</b><p>'+a[2]+'</p></div>'}).join("")+'</div>'+
'<div class="barre"><button id="cmd">Commander maintenant</button></div>'+
(etat.merci?'<div class="merci">✅ Commande envoyée. '+p.nom+' arrive dans environ '+p.min+' minutes.</div>':"")}

function dessiner(){
app.innerHTML=etat.vue==="accueil"?accueil():etat.vue==="resultats"?resultats():fiche();
window.scrollTo(0,0);brancher()}

function chercher(){var v=document.getElementById("q").value;if(!v.trim()){document.getElementById("q").focus();return}etat.requete=v;etat.cat=trouverCat(v);etat.vue="resultats";dessiner()}
function $(s){return app.querySelectorAll(s)}

function brancher(){
var go=document.getElementById("go");
if(go){go.onclick=chercher;document.getElementById("q").onkeydown=function(e){if(e.key==="Enter")chercher()};
 document.getElementById("geo").onclick=function(){
  if(!navigator.geolocation){etat.pos="📍 Yaoundé centre";dessiner();return}
  navigator.geolocation.getCurrentPosition(function(){etat.pos="📍 Position trouvée";dessiner()},function(){etat.pos="📍 Yaoundé centre";dessiner()},{timeout:8000})}}
$(".cat").forEach(function(b){b.onclick=function(){var c=CATS.filter(function(x){return x.id===b.dataset.cat})[0];etat.cat=c.id;etat.requete=c.t;etat.vue="resultats";dessiner()}});
$(".pastille").forEach(function(b){b.onclick=function(){etat.filtre=b.dataset.f;dessiner()}});
$(".res").forEach(function(b){b.onclick=function(){etat.fiche=P.filter(function(p){return p.id===b.dataset.p})[0];etat.merci=false;etat.vue="fiche";dessiner()}});
var r=document.getElementById("retour");if(r)r.onclick=function(){etat.vue=etat.vue==="fiche"?"resultats":"accueil";dessiner()};
var c=document.getElementById("cmd");if(c)c.onclick=function(){etat.merci=true;var y=window.scrollY;dessiner();window.scrollTo(0,y)};
}
dessiner();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
