<style>
:root{--jaune:#FFC244;--jaune-clair:#FFF3D6;--noir:#000;--fond:#fff;--texte:#000;--gris:#6b6b6b;--carte:#f2f2f2;--bord:#e2e2e2;--vert:#1e9e4a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fond:#121212;--texte:#f5f5f5;--gris:#a8a8a8;--carte:#242424;--bord:#333;--jaune-clair:#2b2410}}
:root[data-theme="dark"]{--fond:#121212;--texte:#f5f5f5;--gris:#a8a8a8;--carte:#242424;--bord:#333;--jaune-clair:#2b2410}
html,body{margin:0;background:var(--fond);color:var(--texte);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box}
#app{width:100%;max-width:none;margin:0;min-height:100vh}
button{font:inherit;cursor:pointer;color:inherit}
.haut{background:#000;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
.logo{color:#fff;font-size:26px;font-weight:900}.logo b{color:var(--jaune)}
.pos{background:var(--jaune);color:#000;border:0;border-radius:20px;padding:8px 12px;font-weight:700;font-size:12px}
.jaune{background:var(--jaune);color:#000;padding:20px 18px 26px}
.jaune h1{margin:0;font-size:30px;font-weight:900}.jaune p{margin:4px 0 16px;font-size:15px}
.recherche{display:flex;background:#fff;border:2px solid #000;border-radius:14px;overflow:hidden}
.recherche input{flex:1;min-width:0;border:0;padding:16px 12px;font-size:15px;outline:none;color:#000}
.recherche button{background:#000;border:0;color:#fff;padding:0 18px;font-size:18px}
.grille{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.cat{background:var(--jaune-clair);border:2px solid var(--texte);border-radius:18px;padding:16px;min-height:140px;text-align:left}
.cat .i{font-size:42px;display:block}.cat .t{font-size:19px;font-weight:900;display:block;margin-top:8px}.cat .s{font-size:13px;color:var(--gris);display:block;margin-top:4px}
.pied{text-align:center;color:var(--gris);font-size:12px;padding:8px 16px 28px}
.action-proposer{display:block;width:calc(100% - 32px);margin:0 16px 8px;padding:15px;border:2px solid var(--texte);border-radius:14px;background:var(--fond);font-weight:850;text-align:center}
.form-proposer{padding:20px 16px 40px}.form-proposer h2{margin:0 0 6px;font-size:24px}.form-proposer p{color:var(--gris);margin:0 0 18px;line-height:1.45}.champ{display:block;margin:14px 0}.champ span{display:block;font-weight:750;margin-bottom:6px}.champ input,.champ select,.champ textarea{width:100%;padding:14px;border:1.5px solid var(--bord);border-radius:12px;background:var(--fond);color:var(--texte);font:inherit}.champ textarea{min-height:95px;resize:vertical}.btn-principal{width:100%;padding:15px;border:0;border-radius:14px;background:var(--jaune);color:#000;font-weight:900;font-size:16px;margin-top:10px}.role-info{margin:12px 16px;padding:11px 13px;background:var(--jaune-clair);border-radius:12px;font-size:13px;font-weight:750;color:var(--texte)}
.bandeau{background:#000;padding:14px 16px;display:flex;align-items:center;gap:12px}
.retour{width:40px;height:40px;border-radius:50%;border:0;background:var(--jaune);color:#000;font-size:20px;font-weight:900;flex:none}
.bandeau h2{margin:0;color:#fff;font-size:20px;font-weight:900}.bandeau small{color:var(--jaune);font-size:13px}
.filtres{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px 0}
.pastille{background:transparent;border:2px solid var(--texte);border-radius:20px;padding:7px 12px;font-weight:700;font-size:13px}
.pastille.on{background:var(--texte);color:var(--jaune)}
:root:not([data-theme="dark"]) .pastille.on{color:var(--jaune)}
.liste{padding:16px}
.res{display:flex;gap:12px;width:100%;text-align:left;background:var(--fond);border:1.5px solid var(--bord);border-radius:16px;padding:14px;margin-bottom:12px}
.av{width:60px;height:60px;border-radius:14px;background:var(--jaune-clair);display:flex;align-items:center;justify-content:center;font-size:28px;flex:none}
.res .n{font-weight:800;font-size:16px}.res .m{font-size:13px;color:var(--gris);margin-top:2px}.res .p{font-size:13px;font-weight:700;margin-top:4px}
.badge{display:inline-block;color:#fff;font-size:11px;font-weight:800;border-radius:6px;padding:3px 8px;margin-top:6px}
.ok{background:var(--vert)}.ko{background:#6b6b6b}
.vide{text-align:center;color:var(--gris);padding:40px 24px}
.photo{background:var(--jaune);height:170px;display:flex;align-items:center;justify-content:center;font-size:76px;position:relative}
.photo .retour{position:absolute;top:16px;left:16px}
.fiche{padding:20px 18px 120px}
.fiche h2{margin:0;font-size:24px;font-weight:900}.fiche .q{color:var(--gris);font-size:14px;margin-top:4px}
.chiffres{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.chiffres div{background:var(--carte);border-radius:12px;padding:12px 6px;text-align:center}
.chiffres b{display:block;font-size:16px;font-weight:900}.chiffres span{font-size:11px;color:var(--gris)}
.desc{margin:16px 0;line-height:1.5}
.contact{display:flex;gap:8px}
.contact a{flex:1;text-align:center;text-decoration:none;color:var(--texte);border:2px solid var(--texte);border-radius:12px;padding:14px;font-weight:800}
.fiche h3{margin:24px 0 8px;font-size:18px;font-weight:900}
.avis{background:var(--carte);border-radius:12px;padding:12px;margin-bottom:8px}.avis b{font-size:13px}.avis p{margin:4px 0 0;font-size:14px;line-height:1.4}
.barre{position:fixed;left:0;right:0;bottom:0;background:var(--fond);border-top:1px solid var(--bord);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.barre button{display:block;width:100%;max-width:488px;margin:0 auto;background:var(--jaune);color:#000;border:2px solid #000;border-radius:14px;padding:16px;font-size:17px;font-weight:900}
.merci{position:fixed;left:16px;right:16px;bottom:90px;max-width:488px;margin:0 auto;background:#000;color:#fff;border-radius:14px;padding:14px 16px;font-weight:700;border:2px solid var(--jaune)}

/* Fiche prestataire : version améliorée */
.photo{height:230px;background:linear-gradient(160deg,#FFD36B,#FFC244)}
.photo .gros{font-size:104px;line-height:1;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18))}
.photo .retour{background:#000;color:var(--jaune);width:46px;height:46px;font-size:22px;top:16px;left:16px}
.fiche{position:relative;margin-top:-26px;background:var(--fond);border-radius:26px 26px 0 0;padding:22px 18px 140px}
.ligne1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ligne1 .badge{margin-top:0;font-size:12px;padding:5px 10px}
.tag{background:var(--jaune);color:#000;font-weight:800;font-size:12px;border-radius:6px;padding:5px 10px}
.fiche h2{font-size:28px;line-height:1.15;margin-top:10px}
.fiche .q{font-size:15px;margin-top:6px}
.chiffres{gap:10px;margin-top:18px}
.chiffres div{padding:14px 6px}
.chiffres i{display:block;font-style:normal;font-size:20px;margin-bottom:2px}
.chiffres b{font-size:20px}.chiffres span{font-size:12px;display:block;margin-top:2px}
.fiche h3{font-size:19px;margin:26px 0 10px}
.fiche h3 small{font-size:13px;font-weight:600;color:var(--gris);margin-left:6px}
.desc{font-size:16px;line-height:1.55;margin:0 0 18px}
.contact{gap:10px}
.contact a{min-height:54px;display:flex;align-items:center;justify-content:center;font-size:16px;border-radius:14px;border:0}
.contact .b-appel{background:#000;color:#fff}
.contact .b-wa{background:#25D366;color:#000}
.avis{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px}
.avis .ini{width:38px;height:38px;border-radius:50%;background:var(--jaune);color:#000;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none}
.avis b{font-size:15px}.avis .etoiles{color:#E8A400;font-size:14px;margin-left:4px}
.avis p{font-size:15px;margin:4px 0 0}
.barre{display:flex;align-items:center;gap:14px;padding-left:max(16px,calc((100% - 520px)/2 + 16px));padding-right:max(16px,calc((100% - 520px)/2 + 16px))}
.prixbas{flex:none}.prixbas small{display:block;font-size:12px;color:var(--gris)}.prixbas b{font-size:19px;font-weight:900}
.barre button{flex:1;width:auto;max-width:none;margin:0;min-height:54px;font-size:18px}
.merci{bottom:96px}
.mini{border:2px solid var(--texte);background:transparent;color:var(--texte);border-radius:10px;padding:8px 12px;font-weight:800;margin:8px 8px 0 0}
</style>
</head>
<body>

<script>
// Catégories : « mots » sert à reconnaître ce que l’utilisateur tape
var CATS=[
{id:"restaurant",i:"🍲",t:"Restaurant",s:"Je falla où manger maintenant",m:["restaurant","manger","poulet","braise","braisé","poisson","ndole","ndolé","faim","resto"]},
{id:"shopping",i:"🛒",t:"Shopping",s:"Je falla un magasin ouvert",m:["shopping","magasin","boutique","supermarche","supermarché","pharmacie","eau","gaz","night shop"]},
{id:"laverie",i:"👕",t:"Laverie",s:"Laverie / laveur à domicile",m:["laverie","laveur","laveuse","pressing","linge","lessive","repassage"]},
{id:"plombier",i:"🔧",t:"Plombier",s:"Plombier / dépannage maison",m:["plombier","plomberie","fuite","robinet","wc","toilette","depannage","dépannage"]}
];
// Données fictives de Yaoundé : [id,cat,nom,quartier,emoji,km,min,prixTxt,prix,note,nbAvis,ouvert,statut,domicile,tel,desc,avis]
var P=[
["r1","restaurant","Chez Mama Ngono","Mvog-Ada","🍗",0.6,8,"à partir de 1 500 FCFA",1500,4.6,212,1,"OUVERT",0,"237670000001","Poulet braisé, poisson braisé et miondo. Ouvert tard.",[["Brice",5,"Poulet bien braisé, servi en 10 minutes."],["Estelle",4,"Du monde le soir, mais ça vaut le coup."]]],
["r2","restaurant","Le Ndolé de Bastos","Bastos","🍲",1.4,14,"à partir de 3 000 FCFA",3000,4.8,340,1,"OUVERT",0,"237670000002","Ndolé, eru, koki et plantains. Cadre calme et climatisé.",[["Carine",5,"Le meilleur ndolé du quartier."],["Patrick",5,"Service rapide, un peu cher mais bon."]]],
["r3","restaurant","Poisson Braisé Etoudi","Etoudi","🐟",2.1,19,"à partir de 2 000 FCFA",2000,4.3,98,0,"FERMÉ · ouvre à 17h",0,"237670000003","Bar et maquereau braisés, bâton de manioc.",[["Yannick",4,"Poisson frais, ambiance bon enfant."]]],
["s1","shopping","Night Shop Mendong","Mendong","🌙",0.5,6,"Ouvert 24h/24",0,4.4,76,1,"OUVERT",0,"237670000004","Eau, gaz, recharges, boissons et produits de base, même la nuit.",[["Ruth",5,"Sauvée à 2h du matin, gaz disponible."]]],
["s2","shopping","Super Marché Bastos","Bastos","🛒",1.1,12,"Livraison 500 FCFA",500,4.7,154,1,"OUVERT",1,"237670000005","Grand choix, livraison à domicile dans le quartier.",[["Mireille",5,"Livraison rapide, produits frais."]]],
["s3","shopping","Pharmacie de garde Mvog-Ada","Mvog-Ada","💊",0.9,10,"De garde cette nuit",0,4.5,61,1,"DE GARDE",0,"237670000006","Pharmacie de garde, conseils du pharmacien sur place.",[["Joël",5,"Accueil rapide malgré l’heure tardive."]]],
["l1","laverie","Pressing Express Bastos","Bastos","🧺",0.8,12,"à partir de 500 FCFA",500,4.7,189,1,"OUVERT",0,"237670000007","Lavage, repassage et pressing express. Retrait en 24h.",[["Sandrine",5,"Chemises impeccables, prêtes le lendemain."],["Hervé",4,"Bon travail, de l’attente le samedi."]]],
["l2","laverie","Mama Laveuse Mendong","Mendong","👩🏾",1.3,15,"1 000 FCFA/kg",1000,4.9,128,1,"DISPONIBLE",1,"237670000008","Passe chez toi, lave et rapporte ton linge propre et plié.",[["Nadège",5,"Venue en 15 minutes, linge nickel."],["Fabrice",5,"Sérieuse et ponctuelle."]]],
["l3","laverie","Laverie Etoudi Clean","Etoudi","🫧",2.4,22,"700 FCFA/kg",700,4.2,54,0,"FERMÉ · ouvre à 7h",0,"237670000009","Machines à jetons, séchage inclus.",[["Georges",4,"Pas cher et propre."]]],
["p1","plombier","Dépannage Plomberie Ada","Mvog-Ada","🔧",1.0,15,"Déplacement 2 000 FCFA",2000,4.6,87,1,"DISPONIBLE",1,"237670000010","Fuites, robinets, WC bouchés. Intervention rapide.",[["Clarisse",5,"Fuite réparée en 30 minutes, prix honnête."],["Désiré",4,"Arrivé vite, bien expliqué."]]],
["p2","plombier","Plombier Pro Bastos","Bastos","🚰",1.8,18,"Déplacement 3 000 FCFA",3000,4.8,142,1,"DISPONIBLE",1,"237670000011","Installation sanitaire, chauffe-eau, urgences 24h/24.",[["Olivia",5,"Très pro, matériel de qualité."]]]
].map(function(a){return{id:a[0],cat:a[1],nom:a[2],q:a[3],e:a[4],km:a[5],min:a[6],px:a[7],prix:a[8],note:a[9],nb:a[10],ouvert:!!a[11],statut:a[12],dom:!!a[13],tel:a[14],desc:a[15],avis:a[16]}});

var etat={vue:"accueil",role:null,requete:"",cat:null,filtre:"proche",fiche:null,pos:"📍 Yaoundé",merci:false,offre:null};
var app=document.getElementById("app");

// Sécurise le texte tapé par l’utilisateur avant de l’afficher
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function trouverCat(t){t=t.trim().toLowerCase();if(!t)return null;var c=CATS.filter(function(c){return c.m.some(function(m){return t.indexOf(m)>-1||m.indexOf(t)>-1})})[0];return c?c.id:null}
function fmt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g," ")}

function accueil(){
return '<div class="haut"><div class="logo">Je <b>Falla</b></div><span><button class="pos" id="geo">'+esc(etat.pos)+'</button> <button class="pos" id="cpt">'+(sess?"👤 "+esc(prenom()):"👤 Connexion")+'</button></span></div>'+
'<div class="jaune"><h1>Ça urge ? On trouve.</h1><p>Solutions à moins de 15 minutes autour de toi</p>'+
'<div class="recherche"><input id="q" placeholder="Je falla... ex: poulet braisé, pressing, plombier" enterkeyhint="search"><button id="go" aria-label="Chercher">🔍</button></div></div>'+
'<div class="grille">'+CATS.map(function(c){return '<button class="cat" data-cat="'+c.id+'"><span class="i">'+c.i+'</span><span class="t">'+c.t+'</span><span class="s">'+c.s+'</span></button>'}).join("")+'</div>'+
'<button class="action-proposer" id="ouvrir-proposition">＋ Je propose un service</button>'+
'<div class="pied">Fait à Yaoundé · léger, même avec une connexion lente</div>'}

function liste(){
var t=etat.requete.trim().toLowerCase(),l=etat.cat?P.filter(function(p){return p.cat===etat.cat}):P.filter(function(p){return (p.nom+p.desc+p.q).toLowerCase().indexOf(t)>-1});
if(etat.filtre==="ouvert")l=l.filter(function(p){return p.ouvert});
var tri=etat.filtre==="prix"?function(a,b){return (a.prix||1e9)-(b.prix||1e9)}:function(a,b){return cle(a)-cle(b)};l=l.slice().sort(function(a,b){return sp(a)===sp(b)?tri(a,b):(sp(a)?-1:1)});return l}

function resultats(){
var c=CATS.filter(function(x){return x.id===etat.cat})[0],l=liste();
var F=[["ouvert","Ouvert maintenant"],["prix","Moins cher"],["proche","Le plus proche"]];
return '<div class="bandeau"><button class="retour" id="retour" aria-label="Retour">←</button><div><h2>'+(c?c.i+" "+c.t:"« "+esc(etat.requete)+" »")+'</h2><small>Mode client · '+l.length+' solution(s) près de toi</small></div></div>'+
'<div class="filtres">'+F.map(function(f){return '<button class="pastille'+(etat.filtre===f[0]?" on":"")+'" data-f="'+f[0]+'">'+f[1]+'</button>'}).join("")+'</div><div class="liste">'+
(l.length?l.map(function(p){return '<button class="res" data-p="'+p.id+'"><div class="av">'+p.e+'</div><div><div class="n">'+p.nom+'</div><div class="m">'+dk(p)+' · '+p.min+' min · '+p.q+'</div><div class="p">'+p.px+' · '+nt(p)+'</div><span class="badge '+(p.ouvert?"ok":"ko")+'">'+p.statut+'</span></div></button>'}).join(""):'<div class="vide"><div style="font-size:40px">🤷🏾</div>Rien trouvé pour « '+esc(etat.requete)+' ». Essaie « pressing », « plombier » ou « poulet braisé ».</div>')+'</div>'}

function fiche(){
var p=etat.fiche,msg=encodeURIComponent("Bonjour "+p.nom+", je vous trouve sur Je Falla. J’ai besoin de votre service maintenant.");
var dist=p.dom?"Vient chez toi":(p.km!=null?p.km+" km de toi":"Yaoundé");
return '<div class="photo"><button class="retour" id="retour" aria-label="Retour">←</button><span class="gros">'+p.e+'</span></div>'+
'<div class="fiche"><div class="ligne1"><span class="badge '+(p.ouvert?"ok":"ko")+'">'+p.statut+'</span><span class="tag">⚡ Arrive en '+p.min+' min</span></div>'+
'<h2>'+p.nom+'</h2><div class="q">📍 '+p.q+', Yaoundé · '+dist+'</div>'+
'<div class="chiffres"><div><i>⭐</i><b>'+nt(p)+'</b><span>'+p.nb+' avis</span></div><div><i>⏱️</i><b>'+p.min+' min</b><span>arrivée</span></div><div><i>💰</i><b>'+(p.prix?fmt(p.prix)+" F":"Sur place")+'</b><span>'+p.px+'</span></div></div>'+
'<h3>À propos</h3><p class="desc">'+p.desc+'</p>'+
'<div class="contact"><a class="b-appel" href="tel:+'+p.tel+'">📞 Appeler</a><a class="b-wa" href="https://wa.me/'+p.tel+'?text='+msg+'" target="_blank" rel="noopener">💬 WhatsApp</a></div>'+
'<h3>Avis clients <small>'+(p.nb?p.note.toFixed(1)+' ★ · '+p.nb+' avis':'Aucun avis pour l’instant')+'</small></h3>'+
p.avis.map(function(a){return '<div class="avis"><div class="ini">'+a[0].charAt(0)+'</div><div><b>'+a[0]+'</b> <span class="etoiles">'+"★".repeat(a[1])+"☆".repeat(5-a[1])+'</span><p>'+a[2]+'</p></div></div>'}).join("")+'</div>'+
'<div class="barre"><div class="prixbas"><small>'+(p.prix?"à partir de":"")+'</small><b>'+(p.prix?fmt(p.prix)+" FCFA":"Sur place")+'</b></div><button id="cmd">Commander</button></div>'+
(etat.merci?'<div class="merci">✅ Demande envoyée. '+p.nom+' va te contacter sur WhatsApp.</div>':"")}

function proposer(){
return '<div class="bandeau"><button class="retour" id="retour" aria-label="Retour">←</button><div><h2>＋ Proposer un service</h2><small>Mode prestataire activé pour cette action</small></div></div>'+
(sess?'':'<div class="role-info">Connecte-toi pour publier ton service. <button class="btn-principal" id="vers-compte">Se connecter</button></div>')+'<div class="role-info">Tu gardes le même compte. Si tu recherches ensuite un service, tu repasseras automatiquement en mode client.</div>'+
'<form class="form-proposer" id="form-proposer"><h2>Présente ton service</h2><p>Décris ce que tu proposes afin que les personnes puissent te trouver.</p>'+
'<label class="champ"><span>Nom du service</span><input name="nom" required maxlength="70" placeholder="Ex. Plomberie à domicile"></label>'+
'<label class="champ"><span>Catégorie</span><select name="categorie" required><option value="">Choisir une catégorie</option>'+CATS.map(function(c){return '<option value="'+c.id+'">'+c.i+' '+c.t+'</option>'}).join("")+'</select></label>'+
'<label class="champ"><span>Ta ville / ton quartier</span><input name="quartier" required maxlength="80" placeholder="Ex. Yaoundé, Mendong"></label>'+
'<label class="champ"><span>Description</span><textarea name="description" required maxlength="500" placeholder="Décris ton expérience et le service proposé"></textarea></label>'+
'<label class="champ"><span>Prix indicatif (FCFA, facultatif)</span><input name="prix" type="number" min="0" placeholder="Ex. 5000"></label>'+
'<label class="champ"><span>Numéro de téléphone</span><input name="telephone" type="tel" required placeholder="Ex. 6XXXXXXXX"></label>'+
'<button class="btn-principal" type="submit">Continuer</button></form>'}

function confirmationOffre(){
var o=etat.offre;
return '<div class="bandeau"><button class="retour" id="retour" aria-label="Retour">←</button><div><h2>Service publié</h2><small>Mode prestataire</small></div></div>'+
'<div class="form-proposer"><div style="font-size:42px">✅</div><h2>'+esc(o.nom)+'</h2><p><b>'+esc(o.categorie)+'</b> · '+esc(o.quartier)+'</p><p>'+esc(o.description)+'</p><p>'+(o.prix?fmt(Number(o.prix))+ ' FCFA':'Prix à convenir')+' · '+esc(o.telephone)+'</p>'+
'<div class="role-info">Ton service est publié : les clients peuvent maintenant le trouver. Tu le retrouves dans « Mon espace ».</div>'+
'<button class="btn-principal" id="retour-accueil">Retour à l’accueil</button></div>'}


// ===== Supabase : données, compte, commandes, espace personnel =====
function sp(p){return !!(p.boost&&new Date(p.boost)>new Date())}
function cle(p){return p.km==null?p.min:p.km}
function nt(p){return p.nb?p.note.toFixed(1)+"★":"Nouveau"}
function dk(p){return p.dom?"à domicile":(p.km!=null?p.km+" km":"Yaoundé")}
function g(i){return document.getElementById(i)}
function prenom(){var m=sess&&sess.user&&sess.user.user_metadata;return (m&&m.full_name||"Compte").split(" ")[0]}
function txt(s){var d=document.createElement("div");d.innerHTML=s;return d.textContent}
// Catégories et services viennent de la base ; aucun service d’exemple n’est affiché comme réel
function charger(){return api("/rest/v1/categories?select=*&active=eq.true&order=created_at").then(function(c){if(c&&c.length)CATS=c.map(function(x){var o=CATS.filter(function(y){return y.id===x.slug})[0];return{id:x.slug,i:x.emoji||"📍",t:x.name,s:o?o.s:"Je falla "+x.name.toLowerCase(),m:(x.keywords||[]).concat([x.name.toLowerCase(),x.slug])}})}).catch(function(){}).then(function(){return api("/rest/v1/services?select=*&status=eq.active&order=created_at.desc&limit=100")}).then(function(r){
P=(r||[]).map(function(s){var c=CATS.filter(function(x){return x.id===s.category})[0],ou=s.is_open!==false;return{id:s.id,db:1,cat:s.category,nom:esc(s.title),q:esc(s.neighborhood||s.city||"Yaoundé"),e:c?c.i:"📍",km:null,min:s.eta_minutes||20,px:s.price?"à partir de "+fmt(Math.round(s.price))+" FCFA":"Prix sur demande",prix:Math.round(s.price||0),note:0,nb:0,ouvert:ou,statut:ou?"OUVERT":"FERMÉ"+(s.opens_at?" · ouvre à "+esc(s.opens_at):""),dom:!!s.at_home,tel:tel(s.contact_phone),desc:esc(s.description||""),avis:[],boost:s.boosted_until}});if(etat.vue==="accueil")dessiner()}).catch(function(){})}
function compte(){return '<div class="bandeau"><button class="retour" id="retour" aria-label="Retour">←</button><div><h2>👤 Mon compte</h2></div></div><div class="form-proposer">'+(sess?'<h2>Bonjour '+esc(prenom())+'</h2><p>Un seul compte : tu peux chercher, commander et proposer des services.</p><button class="btn-principal" id="vers-espace">Mon espace</button><button class="btn-principal" id="ouvrir-proposition" style="margin-top:10px">＋ Je propose un service</button><button class="mini" id="deco" style="margin-top:14px">Se déconnecter</button>':'<h2>Connexion</h2><p>Ton numéro de téléphone et un mot de passe suffisent.</p><label class="champ"><span>Téléphone</span><input id="c_tel" type="tel" placeholder="6XXXXXXXX" autocomplete="tel"></label><label class="champ"><span>Mot de passe (6 caractères minimum)</span><input id="c_pw" type="password" autocomplete="current-password"></label><label class="champ"><span>Ton nom (seulement pour créer un compte)</span><input id="c_nom" autocomplete="name"></label><button class="btn-principal" id="c_in">Se connecter</button><button class="btn-principal" id="c_up" style="margin-top:10px">Créer mon compte</button>')+'</div>'}
var ST={new:"Nouvelle",accepted:"Acceptée",done:"Terminée",cancelled:"Refusée"};
function espace(){var E=etat.esp||{s:[],r:[],m:[]};
var ls=E.s.map(function(s){return '<div class="avis"><div><b>'+esc(s.title)+'</b> <small>('+esc(s.status==="active"?"visible":"masqué")+')</small><br><button class="mini" data-sup="'+s.id+'">Supprimer</button></div></div>'}).join("")||"<p>Aucun service pour l’instant.</p>";
var lr=E.r.map(function(o){var b="";if(o.status==="new")b='<button class="mini" data-o="accepted" data-id="'+o.id+'">Accepter</button><button class="mini" data-o="cancelled" data-id="'+o.id+'">Refuser</button>';else if(o.status==="accepted")b='<button class="mini" data-o="done" data-id="'+o.id+'">Terminer</button>';
return '<div class="avis"><div><b>'+esc(o.services?o.services.title:"Service")+'</b> · '+ST[o.status]+'<br>Client : <a href="https://wa.me/'+tel(o.customer_phone)+'" target="_blank" rel="noopener">'+esc(o.customer_phone)+'</a><br>'+b+'</div></div>'}).join("")||"<p>Aucune commande reçue.</p>";
var lm=E.m.map(function(o){return '<div class="avis"><div><b>'+esc(o.services?o.services.title:"Service")+'</b> · '+ST[o.status]+'</div></div>'}).join("")||"<p>Aucune commande passée.</p>";
return '<div class="bandeau"><button class="retour" id="retour" aria-label="Retour">←</button><div><h2>Mon espace</h2></div></div><div class="form-proposer"><h2>Mes services</h2>'+ls+'<h2 style="margin-top:22px">Commandes reçues</h2>'+lr+'<h2 style="margin-top:22px">Mes commandes</h2>'+lm+'</div>'}
function chargerEspace(){var u=sess.user.id;return Promise.all([api("/rest/v1/services?select=id,title,status&user_id=eq."+u+"&status=neq.closed&order=created_at.desc"),api("/rest/v1/orders?select=id,status,user_id,customer_phone,created_at,services(title,user_id)&order=created_at.desc&limit=50")]).then(function(a){var o=a[1]||[];etat.esp={s:a[0]||[],r:o.filter(function(x){return x.services&&x.services.user_id===u}),m:o.filter(function(x){return x.user_id===u})}})}
function ouvrirEspace(){chargerEspace().then(function(){etat.vue="espace";dessiner()}).catch(function(x){alert(x.message)})}
function commander(){var p=etat.fiche;etat.role="client";var t=prompt("Ton numéro WhatsApp, pour que "+txt(p.nom)+" te réponde :");if(!t)return;
api("/rest/v1/orders",{method:"POST",prefer:"return=minimal",body:{service_id:p.id,user_id:sess&&sess.user?sess.user.id:null,customer_phone:tel(t),message:"Commande depuis Je Falla"}}).then(function(){etat.merci=true;var y=window.scrollY;dessiner();window.scrollTo(0,y)}).catch(function(x){alert("Demande non envoyée : "+x.message)})}
function brancher2(){var a=g("cpt");if(a)a.onclick=function(){etat.vue="compte";dessiner()};
var v=g("vers-compte");if(v)v.onclick=function(){etat.vue="compte";dessiner()};
var e=g("vers-espace");if(e)e.onclick=ouvrirEspace;
var d=g("deco");if(d)d.onclick=function(){deconnecter();etat.vue="accueil";dessiner()};
function ent(up){var n=g("c_tel").value,p=g("c_pw").value,nom=g("c_nom").value.trim();if(tel(n).length<11||p.length<6){alert("Numéro (ex. 6XXXXXXXX) et mot de passe de 6 caractères minimum.");return}if(up&&!nom){alert("Ajoute ton nom pour créer le compte.");return}
(up?inscrire(n,p,nom):connecter(n,p)).then(function(ok){if(up&&!ok){alert("Compte créé, mais la confirmation par email est active dans Supabase : désactive « Confirm email ».");return}dessiner()}).catch(function(x){alert(x.message)})}
var i=g("c_in"),u=g("c_up");if(i)i.onclick=function(){ent(false)};if(u)u.onclick=function(){ent(true)};
$("[data-o]").forEach(function(b){b.onclick=function(){api("/rest/v1/orders?id=eq."+b.dataset.id,{method:"PATCH",prefer:"return=minimal",body:{status:b.dataset.o}}).then(ouvrirEspace).catch(function(x){alert(x.message)})}});
$("[data-sup]").forEach(function(b){b.onclick=function(){if(!confirm("Supprimer ce service ?"))return;var id=b.dataset.sup;api("/rest/v1/services?id=eq."+id,{method:"DELETE"}).catch(function(){return api("/rest/v1/services?id=eq."+id,{method:"PATCH",prefer:"return=minimal",body:{status:"closed"}})}).then(function(){return charger()}).then(ouvrirEspace).catch(function(x){alert(x.message)})}})}

function dessiner(){
app.innerHTML=etat.vue==="compte"?compte():etat.vue==="espace"?espace():etat.vue==="accueil"?accueil():etat.vue==="resultats"?resultats():etat.vue==="proposer"?proposer():etat.vue==="offre"?confirmationOffre():fiche();
window.scrollTo(0,0);brancher();brancher2()}

function chercher(){var v=document.getElementById("q").value;if(!v.trim()){document.getElementById("q").focus();return}etat.role="client";etat.requete=v;etat.cat=trouverCat(v);etat.vue="resultats";dessiner()}
function $(s){return app.querySelectorAll(s)}

function brancher(){
var ouvrir=document.getElementById("ouvrir-proposition");
if(ouvrir)ouvrir.onclick=function(){etat.role="prestataire";etat.vue="proposer";dessiner()};
var form=document.getElementById("form-proposer");
if(form)form.onsubmit=function(e){e.preventDefault();if(!sess){etat.vue="compte";dessiner();return}var d=new FormData(form);etat.role="prestataire";
var b={user_id:sess.user.id,title:d.get("nom"),category:d.get("categorie"),neighborhood:d.get("quartier"),description:d.get("description"),price:d.get("prix")?Number(d.get("prix")):null,contact_phone:tel(d.get("telephone")),city:"Yaoundé"};
etat.offre={nom:b.title,categorie:b.category,quartier:b.neighborhood,description:b.description,prix:d.get("prix"),telephone:b.contact_phone};
api("/rest/v1/services",{method:"POST",prefer:"return=minimal",body:b}).then(function(){return charger()}).then(function(){etat.vue="offre";dessiner()}).catch(function(x){alert("Publication impossible : "+x.message)})};
var accueilBtn=document.getElementById("retour-accueil");
if(accueilBtn)accueilBtn.onclick=function(){etat.role=null;etat.vue="accueil";etat.offre=null;dessiner()};
var go=document.getElementById("go");
if(go){go.onclick=chercher;document.getElementById("q").onkeydown=function(e){if(e.key==="Enter")chercher()};
 document.getElementById("geo").onclick=function(){
  if(!navigator.geolocation){etat.pos="📍 Yaoundé centre";dessiner();return}
  navigator.geolocation.getCurrentPosition(function(){etat.pos="📍 Position trouvée";dessiner()},function(){etat.pos="📍 Yaoundé centre";dessiner()},{timeout:8000})}}
$(".cat").forEach(function(b){b.onclick=function(){var c=CATS.filter(function(x){return x.id===b.dataset.cat})[0];etat.role="client";etat.cat=c.id;etat.requete=c.t;etat.vue="resultats";dessiner()}});
$(".pastille").forEach(function(b){b.onclick=function(){etat.filtre=b.dataset.f;dessiner()}});
$(".res").forEach(function(b){b.onclick=function(){etat.fiche=P.filter(function(p){return p.id===b.dataset.p})[0];etat.merci=false;etat.vue="fiche";dessiner()}});
var r=document.getElementById("retour");if(r)r.onclick=function(){etat.vue=etat.vue==="fiche"?"resultats":"accueil";if(etat.vue==="accueil")etat.role=null;dessiner()};
var c=document.getElementById("cmd");if(c)c.onclick=commander;
}
dessiner();charger();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
